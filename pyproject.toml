[project]
name = "pynatlas"
dynamic = ["version"]
description = "Python SDK, OpenAI-compatible server and benchmark kit for N-ATLaS, Nigeria's open multilingual LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nazeh Abel" }]
maintainers = [{ name = "Open Lab Technologies" }]
keywords = ["n-atlas", "llm", "nigeria", "hausa", "igbo", "yoruba", "speech-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]
dependencies = [
    "httpx>=0.27",
]

# Extras are the runtime features users opt into. The core install is the HTTP
# client only, so apps that call a hosted N-ATLaS endpoint pull in httpx and nothing else.
[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "llama-cpp-python>=0.3.8",
    "python-multipart>=0.0.9",
]
asr = [
    "transformers>=4.44",
    "torch>=2.4",
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
]
bench = [
    "sacrebleu>=2.4",
    "jiwer>=3.0",
]

# Contributor tooling, never installed for users.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
    {include-group = "playground"},
]
playground = [
    "streamlit>=1.40",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/open-lab-technologies/natlas-sdk"
Issues = "https://github.com/open-lab-technologies/natlas-sdk/issues"
Changelog = "https://github.com/open-lab-technologies/natlas-sdk/blob/main/CHANGELOG.md"

[project.scripts]
pynatlas = "pynatlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pynatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pynatlas"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with File()/Form() defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pynatlas"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Optional heavy dependencies without type information.
module = ["llama_cpp.*", "soxr", "soundfile", "transformers", "torch", "sacrebleu.*", "jiwer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
