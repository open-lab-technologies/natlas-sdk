[project]
name = "natlas"
version = "0.1.0"
description = "Python SDK, OpenAI-compatible server and benchmark kit for N-ATLAS, Nigeria's open multilingual LLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "llama-cpp-python>=0.3.8",
    "python-multipart>=0.0.9",
]
asr = [
    "transformers>=4.44",
    "torch>=2.4",
    "librosa>=0.10",
    "soundfile>=0.12",
]
playground = [
    "streamlit>=1.40",
    "pandas>=2.0",
]
bench = [
    "sacrebleu>=2.4",
    "jiwer>=3.0",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
natlas = "natlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natlas"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with File()/Form() defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
