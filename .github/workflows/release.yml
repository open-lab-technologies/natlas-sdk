name: Release

# Pushing a tag such as v0.1.0 checks, builds and publishes that version.
# Publishing uses PyPI trusted publishing, so no PyPI token is stored here; the
# project's PyPI settings must list this repository, this workflow file and the
# "pypi" environment as a trusted publisher.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check, type-check and test
        run: |
          uv venv --python 3.12
          uv pip install -e ".[bench]" --group dev
          uv run --no-sync ruff check src tests playground examples
          uv run --no-sync mypy
          uv run --no-sync pytest -q
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-sync python -c "import pynatlas; print(pynatlas.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version"; exit 1; }
      - name: Build
        run: uv build
      - name: Check the built distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
