name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        # llama-cpp-python and torch are left out: the tests use fakes and never
        # load a model, and building llama.cpp would add minutes per run.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[bench]" --group dev
      - name: Lint
        run: uv run --no-sync ruff check src tests playground examples
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test
        run: uv run --no-sync pytest -q

  docker:
    # Compiling llama.cpp takes several minutes, so the image is built on main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pynatlas:ci .
      - name: Check the CLI inside the image
        run: docker run --rm --entrypoint pynatlas pynatlas:ci config
